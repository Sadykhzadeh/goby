[package]
name = "goby"
version = "0.2.0"
edition = "2024"
authors = ["Azer Sadykhzadeh"]
homepage = "https://azer.one"
description = "Lightweight real-time voice changer for Windows: 61 voices, straight into the games and chats you pick."
keywords = ["voice-changer", "wasapi", "audio", "windows", "dsp"]
categories = ["multimedia::audio"]
license = "MIT"
readme = "README.md"

[dependencies]
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    # Audio: WASAPI endpoints, streams and MMCSS scheduling.
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # Window and drawing: Win32, Direct2D, DirectWrite, DirectComposition for Mica.
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# One small binary that is as fast as the compiler can make it.
lto = "fat"
codegen-units = 1
strip = true
